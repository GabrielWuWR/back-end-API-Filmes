components:
  schemas:
    ERROR_BAD_REQUEST:
      type: object
      properties:
        status:
          type: boolean
          description: status false
        status_code:
          type: integer
          format: int64
          description: '400'
        message:
          type: string
          description: Não foi possivel processar a requisição devido a erros de entrada de dados 😣.
        image:
          type: string
          description: https://http.dog/400.jpg
    SUCCESS_DELETED_ITEM:
      type: object
      properties:
        status:
          type: boolean
          description: 'true'
        status_code:
          type: integer
          format: int64
          description: '200'
        message:
          type: string
          description: Item excluido com sucesso 🥳
        image:
          type: string
          description: https://http.dog/200.jpg
    ERROR_INTERNAL_SERVER_MODEL:
      type: object
      properties:
        status:
          type: boolean
          description: 'false'
        status_code:
          type: integer
          format: int64
          description: '500'
        message:
          type: string
          description: Não foi possível processar a requisição devido a um erro interno no servidor. 🤖 [MODEL].
        image:
          type: string
          description: https://http.dog/500.jpg
    ERROR_INTERNAL_SERVER_CONTROLLER:
      type: object
      properties:
        status:
          type: boolean
          description: 'false'
        status_code:
          type: integer
          format: int64
          description: '500'
        message:
          type: string
          description: Não foi possível processar a requisição devido a um erro interno no servidor. 🤖 [CONTROLLER].
        image:
          type: string
          description: https://http.dog/500.jpg
    ERROR_CONTENT_TYPE:
      type: object
      properties:
        status:
          type: boolean
          description: 'false'
        status_code:
          type: integer
          format: int64
          description: '415'
        message:
          type: string
          description: Não foi possível processar a requisição, pois o formato de dados ecaminhado não é suportado pelo servidor, apenas deve ser utilizado JSON. 🤖
        image:
          type: string
          description: https://http.dog/415.jpg
    ERROR_NOT_FOUND:
      type: object
      properties:
        status:
          type: boolean
          description: 'false'
        status_code:
          type: integer
          format: int64
          description: '404'
        message:
          type: string
          description: Não foram encontrados dados para retorno. 🗺️❌
        image:
          type: string
          description: https://http.dog/404.jpg
    Idiomas:
      required:
        - idioma
        - sigla
      type: object
      properties:
        idioma:
          type: string
          description: Nome do idioma a inserir.
        sigla:
          type: string
          description: Sigla do idioma a inserir.
    Pessoa:
      required:
        - nome_nascimento
        - data_nascimento
      type: object
      properties:
        nome_nascimento:
          type: string
          description: Nome da pessoa a inserir.
        data_nascimento:
          type: string
          format: date
          description: Data de nascimento da pessoa a inserir.
        data_falecimento:
          type: string
          format: date
          description: Data de falecimento da pessoa a inserir.
        ano_inicio_carreira:
          type: integer
          format: int64
          description: Ano de inicio de carreira da pessoa a inserir.
        biografia:
          type: string
          description: Biografia da pessoa a inserir.
        altura:
          type: number
          description: Altura da pessoa a inserir.
        cidade_natal:
          type: string
          description: Nome da cidade natal da pessoa a inserir.
        id_sexo:
          type: integer
          format: int64
          description: Id do sexo da pessoa a inserir.
        curiosidades:
          type: array
          description: Array que guarda ids com curiosidades sobre a pessoa a inserir.
          items:
            type: object
            properties:
              id:
                type: integer
                format: int64
                description: id da curiosidade.
            required:
              - id
        premios:
          type: array
          description: Premios recebidos pela pessoa a inserir.
          items:
            type: object
            properties:
              id:
                type: integer
                format: int64
                description: Id do premio recebido.
            required:
              - id
        paises_origem:
          type: array
          description: Paises de origem da pessoa a inserir.
          items:
            type: object
            properties:
              id:
                type: integer
                format: int64
                description: Id do pais.
            required:
              - id
        ocupacoes:
          type: array
          description: Ocupações profissionais da pessoa a inserir.
          items:
            type: object
            properties:
              id:
                type: integer
                format: int64
                description: id da ocupação.
            required:
              - id
        fotos:
          type: array
          description: Fotos da pessoa a inserir.
          items:
            type: object
            properties:
              foto:
                type: string
                description: url da foto a inserir.
            required:
              - foto
        nomes_artisticos:
          type: array
          description: Nomes artisticos da pessoa a inserir.
          items:
            type: object
            properties:
              nome:
                type: string
                description: Nome artisco da pessoa
            required:
              - nome
    Filme:
      required:
        - nome
        - sinopse
        - data_lancamento
        - duracao
        - bilheteria
        - id_status
        - id_classificacao
      type: object
      properties:
        nome:
          type: string
          description: Nome do filme a inserir
        sinopse:
          type: string
          description: Sinopse do filme a inserir.
        data_lancamento:
          type: string
          format: date
          description: Data de lançamento do filme a inserir.
        duracao:
          type: string
          format: time
          description: Duração do filme a inserir.
        bilheteria:
          type: number
          description: Bilheteria do filme a inserir.
        valor:
          type: number
          description: Valor do aluguel do filme (caso exista).
        avaliacao_critica:
          type: integer
          format: int64
          description: Avaliação da critica do filme a inserir.
        avaliacao:
          type: integer
          format: int64
          description: Avaliação do publico geral do filme.
        id_status:
          type: integer
          format: int64
          description: id do status do filme.
        id_classificacao:
          type: integer
          format: int64
          description: id da classificação do filme.
    tipo_atuacao:
      required:
        - tipo
        - descricao
      type: object
      properties:
